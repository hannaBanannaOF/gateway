server:
  port: 8080

spring:
  cloud:
    gateway:
        server:
          webflux:
            globalcors:
              corsConfigurations:
                '[/**]':
                  allowedOrigins: ${ALLOWED_ORIGIN}
                  allowedMethods: "*"
                  allowedHeaders: "*"
                  allowCredentials: true
  data:
    mongodb:
      # Cria o índice TTL de TokenDocument.expiresAt na subida
      auto-index-creation: true
